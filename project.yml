# XcodeGen spec — run `xcodegen` in this folder to create BikeComputer.xcodeproj
# (plus the generated Info.plist and entitlements). Don't commit the output.
name: BikeComputer
options:
  bundleIdPrefix: com.remymargerum
  deploymentTarget:
    iOS: "26.0"   # HKWorkoutSession on iPhone needs iOS 26
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  RideKit:
    path: RideKit
targets:
  BikeComputer:
    type: application
    platform: iOS
    sources:
      - path: BikeComputer
    dependencies:
      - package: RideKit
    scheme: {}   # shared scheme, so `xcodebuild -scheme BikeComputer` works in CI
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remymargerum.bikecomputer
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        # The TestFlight workflow overrides this with its run number, since
        # every upload needs a higher build number.
        CURRENT_PROJECT_VERSION: "1"
        # Signing lives in Config/Signing.xcconfig. Target-level settings here
        # would override it, so don't set CODE_SIGN_STYLE or DEVELOPMENT_TEAM.
        # XcodeGen's iOS preset sets CODE_SIGN_IDENTITY at this level, so it
        # points at a variable the xcconfig defines.
        CODE_SIGN_IDENTITY: $(BIKE_CODE_SIGN_IDENTITY)
    info:
      path: BikeComputer/Info.plist
      properties:
        CFBundleDisplayName: Bike Computer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No custom encryption (HTTPS only), so TestFlight doesn't ask the
        # export compliance question for every build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, bluetooth-central]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSHealthShareUsageDescription: Reads heart rate from your AirPods during rides.
        NSHealthUpdateUsageDescription: Saves rides to Apple Health as cycling workouts with route, power, cadence and distance.
        NSLocationWhenInUseUsageDescription: Records your route, speed and distance while you ride.
        NSBluetoothAlwaysUsageDescription: Connects to your power meter pedals for power and cadence.
        NSMotionUsageDescription: Uses the barometer to measure elevation gain.
    entitlements:
      path: BikeComputer/BikeComputer.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
