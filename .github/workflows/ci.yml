# Compile check on every push. No signing and no secrets: the TestFlight
# workflow (Phase 3 of PLAN.md) is separate.
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ridekit:
    name: RideKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: RideKit
        run: swift test

  ios:
    name: iOS build (unsigned)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install xcodegen xcbeautify
          xcodebuild -version
      - name: Generate project
        run: xcodegen
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project BikeComputer.xcodeproj \
            -scheme BikeComputer \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
