# Compile check on every push. No signing and no secrets: the TestFlight
# workflow (testflight.yml) is separate.
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ridekit:
    name: RideKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5
      - name: swift test
        working-directory: RideKit
        run: swift test

  ios:
    name: iOS build (unsigned)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          brew install xcodegen xcbeautify
          xcodebuild -version
          xcrun altool --version  # used by testflight.yml for the upload
      - name: Generate project
        run: xcodegen
      # Same Release archive the TestFlight workflow makes, minus signing.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project BikeComputer.xcodeproj \
            -scheme BikeComputer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BikeComputer.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
      # Things App Store Connect rejects an upload for.
      - name: Check Info.plist and icon
        run: |
          app="$RUNNER_TEMP/BikeComputer.xcarchive/Products/Applications/BikeComputer.app"
          plist="$app/Info.plist"
          get() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist"; }
          test -f "$app/Assets.car"
          test "$(get CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName)" = AppIcon
          test "$(get ITSAppUsesNonExemptEncryption)" = false
          test "$(get CFBundleIdentifier)" = com.remymargerum.bikecomputer
          echo "version $(get CFBundleShortVersionString) build $(get CFBundleVersion)"
          test "$(get CFBundleShortVersionString)" != '$(MARKETING_VERSION)'
          test "$(get CFBundleVersion)" != '$(CURRENT_PROJECT_VERSION)'
